name: Windows installer build
on:
  workflow_dispatch:
    inputs:
      update_engine:
        description: Use the latest stable yt-dlp and matching YouTube dependencies
        type: boolean
        default: true
  push:
    tags: ['v*']
    branches: ['maintenance/windows-*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and build dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Refresh engine for manually requested maintenance builds
        if: github.event_name == 'workflow_dispatch' && inputs.update_engine
        run: python -m pip install --upgrade "yt-dlp[default,deno]"
      - name: Install FFmpeg and Inno Setup
        run: choco install ffmpeg innosetup --yes --no-progress
      - name: Check dependencies and regressions
        run: |
          python -m pip check
          python -m unittest discover -s tests -v
      - name: Build portable application and installer
        run: python tools/build_windows.py
      - name: Verify installer and packaged desktop startup
        run: python tools/verify_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: ParrMotion-windows-x64
          path: |
            dist/ParrMotion-windows-x64.zip
            dist/ParrMotion-Setup-windows-x64.exe
            dist/build-versions.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
